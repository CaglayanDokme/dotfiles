# tmux 3.6, used over SSH from VS Code / Windows Terminal. Reload: prefix + r.

# tmux-256color terminfo is present here (ncurses-base); if a remote you ssh into from a pane
# lacks it, run:  TERM=xterm-256color ssh host
set -g  default-terminal "tmux-256color"

# Don't inherit $SHELL (can be a stale /bin/bash, e.g. from a long-lived VS Code server)
set -g  default-shell /usr/bin/zsh

set -as terminal-features ",xterm-256color:RGB"   # the OUTER terminal does 24-bit colour

set -s escape-time 10        # Esc reaches vim promptly; 0 can split Alt sequences on slow links
set -s focus-events on       # FocusGained/FocusLost for editors
set -s set-clipboard on      # accept OSC 52 from panes AND forward it to the client terminal
set -g allow-passthrough on  # let \ePtmux;...\e\\ wrapped sequences through

set -g  mouse on
set -g  history-limit 50000
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  status-interval 5
set -g  display-time 2000

# Status line: host:session left, date/time right. ASCII only (p10k runs in ascii mode).
set -g  status-style "bg=colour236,fg=colour250"
set -g  status-left-length 40
set -g  status-left "#[bold] #h:#S #[nobold]| "
set -g  status-right " %Y-%m-%d %H:%M "
setw -g window-status-current-style "bold,fg=colour214"

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Middle-click in a plain shell: paste the desktop PRIMARY selection (text selected in Firefox etc.)
# instead of tmux's own paste buffer. Apps that grab the mouse (Claude Code, vim) still get the click.
# Needs wl-clipboard; without it (or over SSH, no Wayland) falls back to the tmux buffer.
set -g @paste_primary "wl-paste --primary --no-newline 2>/dev/null | tmux load-buffer -b primary - 2>/dev/null && tmux paste-buffer -p -d -b primary -t '#{pane_id}' || tmux paste-buffer -p -t '#{pane_id}'"
# In copy mode (e.g. right after selecting), leave it first and then paste.
bind -n MouseDown2Pane select-pane -t = \; if -F "#{==:#{pane_mode},copy-mode}" { send -X cancel ; run -b "#{E:@paste_primary}" } { if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { run -b "#{E:@paste_primary}" } }

# Mouse selection -> desktop PRIMARY selection (middle-click paste into Firefox, other terminals...).
# xclip (X11 PRIMARY via XWayland), not wl-copy: GNOME has no data-control protocol, so wl-copy's
# focus trick isn't seen by native Wayland apps like Ptyxis. copy-command is used by every
# copy-pipe* without an explicit command; OSC 52 is still sent too.
set -s copy-command 'xclip -selection primary -i >/dev/null 2>&1'
# Keep the selection highlighted after releasing the mouse (like a plain terminal) instead of
# leaving copy mode. Click to clear it; q / Escape (or middle-click, see above) to leave copy mode.
#
# Word/line select happen on the 2nd/3rd mouse-DOWN (SecondClick/TripleClick fire immediately), so
# holding after a double/triple click and dragging extends the selection word-/line-wise. tmux's
# own DoubleClick event arrives ~300ms later even mid-drag, so it is made a no-op.
# tmux's click window is a hard-coded 300ms (GNOME uses 400ms), so a normal-speed triple-click often
# arrives as double-click + new click: clicking inside a word selected by double-click therefore
# promotes it to a line selection. @sel_kind (per pane) remembers whether the selection is a word.
# The copy happens on release (MouseUp / MouseDragEnd). Bindings are for the default emacs
# mode-keys (copy-mode table); add copy-mode-vi copies if mode-keys is ever set to vi.
bind -n SecondClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word ; set -p @sel_kind word }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line ; set -p @sel_kind line }
bind -n DoubleClick1Pane if -F "#{&&:#{mouse_any_flag},#{?pane_in_mode,0,1}}" { send -M }
bind -T copy-mode MouseDown1Pane    select-pane \; if -F "#{&&:#{==:#{@sel_kind},word},#{&&:#{==:#{selection_start_y},#{e|-|:#{e|+|:#{history_size},#{mouse_y}},#{scroll_position}}},#{&&:#{e|>=|:#{mouse_x},#{selection_start_x}},#{e|<=|:#{mouse_x},#{selection_end_x}}}}}" { send -X select-line ; set -p @sel_kind line } { send -X clear-selection ; set -p @sel_kind none }
bind -T copy-mode SecondClick1Pane  select-pane \; send -X select-word \; set -p @sel_kind word
bind -T copy-mode TripleClick1Pane  select-pane \; send -X select-line \; set -p @sel_kind line
bind -T copy-mode DoubleClick1Pane  select-pane
bind -T copy-mode MouseUp1Pane      if -F '#{selection_present}' { send -X copy-pipe-no-clear }
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
