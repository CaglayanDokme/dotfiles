# tmux 3.6, used over SSH from VS Code / Windows Terminal. Reload: prefix + r.

# tmux-256color terminfo is present here (ncurses-base); if a remote you ssh into from a pane
# lacks it, run:  TERM=xterm-256color ssh host
set -g  default-terminal "tmux-256color"

# Don't inherit $SHELL (can be a stale /bin/bash, e.g. from a long-lived VS Code server)
set -g  default-shell /usr/bin/zsh

set -as terminal-features ",xterm-256color:RGB"   # the OUTER terminal does 24-bit colour

set -s escape-time 10        # Esc reaches vim promptly; 0 can split Alt sequences on slow links
set -s focus-events on       # FocusGained/FocusLost for editors
set -s set-clipboard on      # accept OSC 52 from panes AND forward it to the client terminal
set -g allow-passthrough on  # let \ePtmux;...\e\\ wrapped sequences through

set -g  mouse on
set -g  history-limit 50000
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  status-interval 5
set -g  display-time 2000

# Status line: host:session left, date/time right. ASCII only (p10k runs in ascii mode).
set -g  status-style "bg=colour236,fg=colour250"
set -g  status-left-length 40
set -g  status-left "#[bold] #h:#S #[nobold]| "
set -g  status-right " %Y-%m-%d %H:%M "
setw -g window-status-current-style "bold,fg=colour214"

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
